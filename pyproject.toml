[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "leapgence-leader-arm"
dynamic = ["version"]
description = "Python SDK for LeapGence Leader Arm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LeapGence" }]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://www.leapgence.com"
Documentation = "https://www.leapgence.com/docs/leader-arm/"
Repository = "https://github.com/LeapGence-Robotics/LeapGence-Leader-Arm-SDK"
Issues = "https://github.com/LeapGence-Robotics/LeapGence-Leader-Arm-SDK/issues"

[tool.hatch.version]
path = "src/leapgence/leader_arm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/leapgence"]

[tool.hatch.build.targets.wheel.force-include]
"description" = "leapgence/leader_arm/description"

[tool.hatch.build.targets.sdist]
include = [
  "/src/leapgence",
  "/description",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
